.push: &push
  name: 自检
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  services:
    - docker # 启用 Docker 服务（用于 docker build/push）
  docker:
    image: docker.cnb.cool/dtapp/golang:latest # 统一使用预构建的 CI 环境镜像
    volumes:
      - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
      - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      - ./scripts/ci:copy-on-write # 模板脚本缓存；卷会整体挂载该目录，同步前需先还原跟踪文件
  stages:
    - name: 同步脚本
      script: |
        # 卷会整体挂载 scripts/ci，先把本次提交里跟踪的脚本还原（未跟踪的模板脚本由缓存/下载提供）
        git checkout -- scripts/ci
        make fetch-scripts
    - name: 安装全部 Go 依赖
      script: make deps-go
    # - name: 格式化/修复项目
    #   script: make format
    - name: 运行 Go 静态检查
      script: make check-go-vet
    - name: 运行 Go lint 扫描
      script: make check-go-lint
    - name: 运行 Go fix 问题
      script: make check-go-fix
    - name: 运行 Go 单元测试
      script: make check-go-test
    - name: 运行 Go 依赖漏洞检查
      script: make check-go-vuln

'**':
  push:
    - *push
