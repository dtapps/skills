branch:
  - buttons:
      - name: 发布版本
        description: 从源码构建全平台产物并发布到 CNB Release
        event: web_trigger_release # 触发的 CI 事件名，见 .cnb/workflows/release.yml
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: 发布版本
            description: 请输入版本号，如 v1.2.3；预发布请带 rc/beta/alpha/nightly 后缀，如 v1.2.3-rc.1、v1.2.3-nightly.20260101（填 nightly 自动推导当天夜间构建版本）
            required: true # 是否必填
            type: input
            default: nightly
          commit:
            name: 构建提交
            description: 可选：要发布的代码版本（完整 SHA / 分支 / tag）；留空则用当前分支 HEAD，填写时必须是本次触发的提交
            required: false
            type: input
      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
