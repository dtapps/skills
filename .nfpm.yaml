# nfpm 配置文件
# 用于打包 deb 和 rpm
# 文档: https://nfpm.goreleaser.com/configuration/

name: dtskills
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: default
priority: optional
maintainer: dtapp <dtapp@example.com>
description: |
  dtSkill CLI 工具 - 一个基于 Go 语言的 Skills 管理工具
  支持生成技能包、执行命令、配置管理和自升级功能
vendor: dtapp
homepage: https://cnb.cool/dtapp/skills
license: MIT

# 源文件 -> 目标路径
contents:
  # 二进制文件
  - src: ./dist/dtskills-linux-${ARCH}
    dst: /usr/bin/dtskills
    file_info:
      mode: 0755
      owner: root
      group: root

  # 配置文件 (示例)
  - src: ./config.yaml.example
    dst: /etc/dtskills/config.yaml
    type: config|noreplace
    file_info:
      mode: 0644
      owner: root
      group: root

  # 文档
  - src: ./README.md
    dst: /usr/share/doc/dtskills/README.md
    file_info:
      mode: 0644

# 依赖
# depends:
#   - ca-certificates

# 推荐
# recommends:
#   - upx

# 冲突
# conflicts:
#   - dtskills-beta

# 替换
# replaces:
#   - dtskills-old

# 安装后脚本
scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh

# deb 特定配置
deb:
  # 压缩算法
  compression: xz

# rpm 特定配置
rpm:
  # 压缩算法
  compression: xz
  # 签名
  # signature:
  #   key_file: ./gpg.key
  #   key_id: 12345678
